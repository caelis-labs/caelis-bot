<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>RC2 Browser Semantic Diagnostic</title>
<style>body{font:20px system-ui;margin:48px}label{display:block;padding:24px;border:1px solid #777;max-width:480px}</style>
</head>
<body>
<h1>RC2 Browser Semantic Diagnostic</h1>
<p>Disposable local checkbox. No network, storage or external effects.</p>
<label><input id="diagnostic-check" type="checkbox" aria-label="Diagnostic checkbox"> Diagnostic checkbox</label>
<p id="diagnostic-status">Checked: false; input events: 0; change events: 0</p>
<script>
const box=document.getElementById('diagnostic-check');
const status=document.getElementById('diagnostic-status');
let inputs=0, changes=0;
function render(){status.textContent=`Checked: ${box.checked}; input events: ${inputs}; change events: ${changes}`}
box.addEventListener('input',()=>{inputs++;render()});
box.addEventListener('change',()=>{changes++;render()});
</script>
</body>
</html>
