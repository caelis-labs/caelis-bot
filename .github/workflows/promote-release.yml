name: Publish accepted macOS candidate
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing draft Stable or Dev tag
        required: true
        type: string
      candidate_run_id:
        description: Successful Prepare macOS arm64 candidate run
        required: true
        type: string
      accepted_dmg_sha256:
        description: SHA-256 of the exact candidate DMG accepted by the owner
        required: true
        type: string
      acceptance_url:
        description: Link to the candidate-specific acceptance and blocker review
        required: true
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: caelis-bot-promote-macos-arm64-${{ contains(inputs.tag, '-') && 'dev' || 'stable' }}
  cancel-in-progress: false
jobs:
  verify:
    if: github.repository == 'caelis-labs/caelis-bot' && github.ref == 'refs/heads/main'
    runs-on: macos-15
    environment: macos-release
    timeout-minutes: 25
    outputs:
      source: ${{ steps.candidate.outputs.source }}
      channel: ${{ steps.candidate.outputs.channel }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - name: Download exact retained candidate
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag }}
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
        run: |
          set -euo pipefail
          [[ "$CANDIDATE_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          gh api "repos/$GH_REPO/actions/runs/$CANDIDATE_RUN_ID" > "$RUNNER_TEMP/candidate-run.json"
          node script/verify-candidate-run.mjs "$RUNNER_TEMP/candidate-run.json" "$GH_REPO"
          gh run download "$CANDIDATE_RUN_ID" --repo "$GH_REPO" --name release-dmg --dir release
      - name: Check digest, tag, source, signatures, staples and Gatekeeper
        id: candidate
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          ACCEPTED_DMG_SHA256: ${{ inputs.accepted_dmg_sha256 }}
          ACCEPTANCE_URL: ${{ inputs.acceptance_url }}
          BOT_SPARKLE_PUBLIC_KEY: ${{ vars.SPARKLE_PUBLIC_KEY }}
          BOT_SIGNING_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
        run: bash script/verify-release-candidate.sh release
  publish:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          run-id: ${{ inputs.candidate_run_id }}
          github-token: ${{ github.token }}
          name: release-dmg
          path: release
      - name: Recheck exact accepted bytes and publish immutable GitHub assets
        env:
          GH_TOKEN: ${{ github.token }}
          BOT_RELEASE_TAG: ${{ inputs.tag }}
          BOT_RELEASE_SOURCE_SHA: ${{ needs.verify.outputs.source }}
          BOT_RELEASE_CHANNEL: ${{ needs.verify.outputs.channel }}
          BOT_RELEASE_VALIDATION: developer-id-notarized-stapled-gatekeeper
          BOT_SPARKLE_PUBLIC_KEY: ${{ vars.SPARKLE_PUBLIC_KEY }}
          ACCEPTED_DMG_SHA256: ${{ inputs.accepted_dmg_sha256 }}
        run: |
          set -euo pipefail
          node script/update-manifest.mjs verify release
          test "$(node -p 'require("./release/latest.json").sha256')" = "$ACCEPTED_DMG_SHA256"
          node script/publication.mjs release macos arm64 "$BOT_RELEASE_CHANNEL"
  r2:
    needs: [verify, publish]
    runs-on: ubuntu-latest
    environment: macos-release
    timeout-minutes: 20
    concurrency:
      group: caelis-bot-r2-macos-arm64-${{ needs.verify.outputs.channel }}
      cancel-in-progress: false
    permissions:
      contents: read
      actions: read
    outputs:
      current: ${{ steps.r2.outputs.current }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          run-id: ${{ inputs.candidate_run_id }}
          github-token: ${{ github.token }}
          name: release-dmg
          path: release
      - name: Sync this platform's isolated R2 channel
        id: r2
        env:
          GH_TOKEN: ${{ github.token }}
          BOT_RELEASE_TAG: ${{ inputs.tag }}
          BOT_SPARKLE_PUBLIC_KEY: ${{ vars.SPARKLE_PUBLIC_KEY }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET: caelis-releases
        run: |
          result=$(node script/publish-r2.mjs release)
          echo "$result"
          if [[ "$result" == Published* ]]; then echo 'current=true' >> "$GITHUB_OUTPUT"; fi
  latest:
    needs: [verify, r2]
    if: needs.verify.outputs.channel == 'stable' && needs.r2.outputs.current == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - name: Reconcile GitHub Latest after Stable R2 is current
        env:
          GH_TOKEN: ${{ github.token }}
          BOT_RELEASE_TAG: ${{ inputs.tag }}
        run: node script/sync-github-latest.mjs
