name: Retry R2 sync
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Exact published macOS arm64 tag to reconcile
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: caelis-bot-r2-macos-arm64-stable
  cancel-in-progress: false
jobs:
  sync:
    if: github.repository == 'caelis-labs/caelis-bot' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: macos-release
    timeout-minutes: 20
    outputs:
      current: ${{ steps.r2.outputs.current }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - name: Download this platform's published signed update
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          tag="$RELEASE_TAG"
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test "$(gh api "repos/$GH_REPO/releases/tags/$tag" --jq .draft)" = false
          echo "BOT_RELEASE_TAG=$tag" >> "$GITHUB_ENV"
          gh release download "$tag" --dir release --pattern "Caelis-Bot-${tag#v}-macos-arm64.dmg" --pattern "Caelis-Bot-${tag#v}-macos-arm64.dmg.sha256" --pattern appcast.xml --pattern latest.json --pattern latest.json.sig
      - name: Verify signatures and synchronize R2
        id: r2
        env:
          GH_TOKEN: ${{ github.token }}
          BOT_SPARKLE_PUBLIC_KEY: ${{ vars.SPARKLE_PUBLIC_KEY }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET: caelis-releases
        run: |
          result=$(node script/publish-r2.mjs release)
          echo "$result"
          if [[ "$result" == Published* ]]; then echo 'current=true' >> "$GITHUB_OUTPUT"; fi
  latest:
    needs: sync
    if: needs.sync.outputs.current == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - name: Reconcile GitHub Latest after R2 is current
        env:
          GH_TOKEN: ${{ github.token }}
          BOT_RELEASE_TAG: ${{ inputs.tag }}
        run: node script/sync-github-latest.mjs
