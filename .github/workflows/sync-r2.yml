name: Retry R2 sync
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Exact published tag to reconcile
        required: true
        type: string
      platform:
        description: Platform to reconcile
        type: choice
        options: [macos, windows, linux]
        default: macos
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
      platform:
        required: true
        type: string
    secrets:
      R2_ACCESS_KEY_ID:
        required: true
      R2_SECRET_ACCESS_KEY:
        required: true
      R2_ENDPOINT:
        required: true
permissions:
  contents: read
concurrency:
  group: caelis-bot-r2-${{ inputs.platform }}
  cancel-in-progress: false
jobs:
  sync:
    if: github.repository == 'caelis-labs/caelis-bot' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment: ${{ inputs.platform == 'linux' && 'linux-release' || inputs.platform == 'windows' && 'windows-release' || 'macos-release' }}
    timeout-minutes: 20
    outputs:
      current: ${{ steps.r2.outputs.current }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - name: Download exact published platform assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_PLATFORM: ${{ inputs.platform }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          echo "BOT_RELEASE_TAG=$RELEASE_TAG" >> "$GITHUB_ENV"
          node script/download-release.mjs "$RELEASE_PLATFORM" "$RELEASE_TAG" release
      - name: Verify signatures and synchronize R2
        id: r2
        env:
          GH_TOKEN: ${{ github.token }}
          BOT_SPARKLE_PUBLIC_KEY: ${{ vars.SPARKLE_PUBLIC_KEY }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET: caelis-releases
          AWS_RETRY_MODE: standard
          AWS_MAX_ATTEMPTS: 6
          RELEASE_PLATFORM: ${{ inputs.platform }}
        run: |
          publisher=script/publish-r2.mjs
          if [[ "$RELEASE_PLATFORM" == windows ]]; then publisher=script/windows-publish-r2.mjs; fi
          if [[ "$RELEASE_PLATFORM" == linux ]]; then publisher=script/linux-publish-r2.mjs; fi
          result=$(node "$publisher" release)
          echo "$result"
          if [[ "$result" == Published* ]]; then echo 'current=true' >> "$GITHUB_OUTPUT"; fi
  latest:
    needs: sync
    if: inputs.platform == 'macos' && needs.sync.outputs.current == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - name: Reconcile GitHub Latest after R2 is current
        env:
          GH_TOKEN: ${{ github.token }}
          BOT_RELEASE_TAG: ${{ inputs.tag }}
        run: node script/sync-github-latest.mjs
