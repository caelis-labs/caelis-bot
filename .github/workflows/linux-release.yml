name: Release Linux managed bundles
on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
    secrets:
      LINUX_RELEASE_ED25519_PRIVATE_KEY:
        required: false
      R2_ACCESS_KEY_ID:
        required: false
      R2_SECRET_ACCESS_KEY:
        required: false
      R2_ENDPOINT:
        required: false
  workflow_dispatch:
    inputs:
      tag:
        description: Exact main stable release tag
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: linux-release-${{ inputs.tag }}
  cancel-in-progress: false
jobs:
  build:
    if: github.repository == 'caelis-labs/caelis-bot' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      matrix:
        arch: [amd64, arm64]
    outputs:
      sha: ${{ steps.source.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve exact main release source
        id: source
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          sha=$(git rev-parse "refs/tags/$TAG^{commit}")
          git merge-base --is-ancestor "$sha" origin/main
          git checkout --detach "$sha"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - run: npm ci
      - name: Build real release Bot, bundled CLI and launcher without signing credentials
        env:
          BOT_UPDATE_KIND: release
          BOT_UPDATE_ARCH: ${{ matrix.arch }}
          TAG: ${{ inputs.tag }}
          SOURCE: ${{ steps.source.outputs.sha }}
        run: |
          set -euo pipefail
          export BOT_UPDATE_VERSION="${TAG#v}"
          export BOT_UPDATE_OUTPUT="$PWD/dist/linux-$BOT_UPDATE_ARCH"
          bash script/build-managed-headless.sh
          node script/verify-linux-build.mjs "$BOT_UPDATE_OUTPUT" "$BOT_UPDATE_ARCH" "$SOURCE" "$BOT_UPDATE_VERSION"
          tar -czf "dist/unsigned-linux-$BOT_UPDATE_ARCH.tar.gz" -C "$BOT_UPDATE_OUTPUT" .
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unsigned-linux-${{ matrix.arch }}
          path: dist/unsigned-linux-${{ matrix.arch }}.tar.gz
          retention-days: 1
          if-no-files-found: error
  sign:
    needs: build
    runs-on: ubuntu-24.04
    environment: linux-release
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.build.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: unsigned-linux-*
          path: dist
          merge-multiple: true
      - name: Verify provenance and sign all install/update assets with the pinned Ed25519 identity
        env:
          BOT_LINUX_PRIVATE_KEY: ${{ secrets.LINUX_RELEASE_ED25519_PRIVATE_KEY }}
          TAG: ${{ inputs.tag }}
          SOURCE: ${{ needs.build.outputs.sha }}
        run: |
          set -euo pipefail
          umask 077
          key=$(mktemp "$RUNNER_TEMP/linux-signing.XXXXXX")
          trap 'rm -f "$key"' EXIT
          printf '%s' "$BOT_LINUX_PRIVATE_KEY" > "$key"
          unset BOT_LINUX_PRIVATE_KEY
          mkdir release
          for arch in amd64 arm64; do
            dir="dist/sign-$arch"
            mkdir "$dir"
            tar -xzf "dist/unsigned-linux-$arch.tar.gz" -C "$dir"
            node script/verify-linux-build.mjs "$dir" "$arch" "$SOURCE" "${TAG#v}"
            node script/linux-release.mjs prepare "$dir" "$arch" "$key"
            node --input-type=module - "$dir" "$arch" <<'JS'
          import {verifyLinux} from './script/linux-release.mjs';
          import {copyFileSync} from 'node:fs';
          import {join} from 'node:path';
          const [directory,arch]=process.argv.slice(2);
          for(const name of verifyLinux(directory,arch).names)copyFileSync(join(directory,name),join('release',name));
          JS
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: signed-linux
          path: release/*
          retention-days: 7
          if-no-files-found: error
  publish:
    needs: [build, sign]
    runs-on: ubuntu-24.04
    environment: linux-release
    permissions:
      contents: write
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.build.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: signed-linux
          path: release
      - name: Publish immutable GitHub assets and read every object back
        env:
          GH_TOKEN: ${{ github.token }}
          BOT_RELEASE_TAG: ${{ inputs.tag }}
        run: node script/linux-publish.mjs release
  r2:
    needs: publish
    uses: ./.github/workflows/sync-r2.yml
    with:
      tag: ${{ inputs.tag }}
      platform: linux
    secrets:
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
