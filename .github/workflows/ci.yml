name: Product checks
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: product-${{ github.ref }}
  cancel-in-progress: true
jobs:
  scope:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      kind: ${{ steps.scope.outputs.kind }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Scope fetches the exact event base if it predates these parents.
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Validate every workflow independently of platform routing
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
      - name: Validate CI routing and release metadata rules
        run: |
          node --test script/ci-scope.test.mjs script/release-version.test.mjs
          node script/check-public-tree.mjs
      - name: Select checks from changed content
        id: scope
        env:
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          node script/ci-scope.mjs
          git diff --check
  macos-product:
    needs: scope
    if: contains(fromJSON('["full","shared","macos"]'), needs.scope.outputs.kind)
    runs-on: macos-15
    timeout-minutes: 30
    env:
      BOT_BUILD_CHANNEL: development
      GOWORK: "off"
      GOCACHE: ${{ github.workspace }}/.cache/go-build
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: package-lock.json
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.sum
            script/env.sh
      - run: npm ci
      - run: make check
      - run: npm run smoke:assets
      - name: Exercise isolated native SSH recovery and ownership
        run: |
          make test-ssh-auth
          CAELIS_BOT_TEST_SSHD=1 go test -race -count=1 ./internal/machines -run 'TestNativeSSHReconnect|TestNativeDeletedSSHCapacity'
  linux-headless:
    needs: scope
    if: contains(fromJSON('["full","shared"]'), needs.scope.outputs.kind)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GOWORK: "off"
      GOCACHE: ${{ github.workspace }}/.cache/go-build
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.sum
            script/env.sh
      - name: Check native remote ownership and recovery races
        run: go test -race ./internal/backend/codex ./internal/backend/caelis ./internal/machines ./internal/sshtransport ./internal/tasks ./internal/taskterminal ./internal/weixin ./internal/secretstore
      - name: Build both managed architectures and run native Linux upgrade recovery at umask 077
        run: bash script/ci-linux-headless.sh
  windows-product:
    needs: scope
    if: contains(fromJSON('["full","shared","windows"]'), needs.scope.outputs.kind)
    runs-on: windows-2025
    timeout-minutes: 30
    env:
      GOWORK: "off"
      CGO_ENABLED: "0"
      CI_SOURCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Run native Windows shared and platform contracts
        shell: pwsh
        run: |
          npm ci
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./script/check-windows.ps1
      - name: Preserve Windows state I/O diagnostic evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-state-io-${{ github.sha }}
          path: .cache/windows-state-io/
          if-no-files-found: ignore
          retention-days: 7
      - name: Verify pinned Windows Desktop World payload
        shell: pwsh
        run: |
          $plugins = '.cache/ci-desktop-world/Plugins'
          $package = Join-Path $plugins 'desktop-world'
          & ./script/stage-desktop-world-windows.ps1 -Destination $package
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $releasePin = Get-Content -Raw -LiteralPath 'resources/desktop-world/release.json' | ConvertFrom-Json
          $inventory = Get-Content -Raw -LiteralPath (Join-Path $plugins 'desktop-world-inventory.json') | ConvertFrom-Json
          if ($inventory.ID -ne 'desktop-world' -or $inventory.Title -ne 'Computer Use' -or
              $inventory.titleZh -ne '电脑操控' -or $inventory.Version -ne $releasePin.version.TrimStart('v')) {
            throw 'Windows Desktop World plugin inventory mismatch'
          }
          node script/verify-desktop-world-version.mjs (Join-Path $package 'bin/dtw.exe')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
  # Keep the existing required check name. Failed/cancelled/missing jobs must
  # fail this gate; only content-validated docs/version changes may skip builds.
  product:
    needs: [scope, macos-product, windows-product, linux-headless]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            script/ci-scope.mjs
            script/release-version.mjs
            .node-version
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - name: Require every selected check to pass
        env:
          CI_KIND: ${{ needs.scope.outputs.kind }}
          CI_SCOPE_RESULT: ${{ needs.scope.result }}
          CI_MACOS_RESULT: ${{ needs.macos-product.result }}
          CI_WINDOWS_RESULT: ${{ needs.windows-product.result }}
          CI_LINUX_RESULT: ${{ needs.linux-headless.result }}
        run: node script/ci-scope.mjs --gate
