name: Product checks
on:
  pull_request:
  workflow_dispatch:
    inputs:
      preview:
        description: Package and upload a development DMG
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: product-${{ github.ref }}
  cancel-in-progress: true
jobs:
  scope:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      kind: ${{ steps.scope.outputs.kind }}
      preview: ${{ steps.scope.outputs.preview }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - name: Validate CI routing and release metadata rules
        run: |
          node --test script/ci-scope.test.mjs script/release-version.test.mjs
          node script/check-public-tree.mjs
      - name: Select checks from changed content
        id: scope
        env:
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          node script/ci-scope.mjs
          git diff --check
  macos-product:
    needs: scope
    if: needs.scope.outputs.kind == 'full'
    runs-on: macos-15
    timeout-minutes: 30
    env:
      BOT_BUILD_CHANNEL: development
      GOWORK: "off"
      GOCACHE: ${{ github.workspace }}/.cache/go-build
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: package-lock.json
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.sum
            script/env.sh
      - name: Validate workflows
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
      - run: npm ci
      - run: make check
      - name: Check desktop authority, receipts and projection races
        run: |
          source script/env.sh
          go test -race ./internal/desktopcontrol ./internal/bot ./internal/backend ./internal/backend/caelis ./internal/backend/codex ./internal/app ./internal/telegram ./internal/machines ./internal/remotework ./internal/tasks ./internal/taskterminal
      - run: npm run smoke:assets
      - name: Build independent Dev app with Desktop World
        run: make build
      - name: Verify pinned Desktop World payload without desktop permissions
        run: bash script/verify-desktop-world.sh 'dist/Caelis Bot Dev.app' adhoc
      - name: Exercise the packaged Go host and independent helper
        run: |
          source script/env.sh
          export CAELIS_BOT_TEST_DESKTOP_WORLD="$PWD/dist/Caelis Bot Dev.app/Contents/Resources/DesktopWorld/bin/dtw"
          go test -count=1 -run '^TestPackagedHelperReadAndDeniedInput$' -v ./internal/desktopcontrol
      - name: Package and verify mounted Dev DMG
        if: needs.scope.outputs.preview == 'true' || inputs.preview == true
        run: bash script/package.sh --skip-build
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: needs.scope.outputs.preview == 'true' || inputs.preview == true
        with:
          name: macos-arm64-dev-preview
          path: |
            dist/releases/Caelis-Bot-Dev-*.dmg
            dist/releases/Caelis-Bot-Dev-*.dmg.sha256
          if-no-files-found: error
          retention-days: 7
  linux-headless:
    needs: scope
    if: needs.scope.outputs.kind == 'full'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GOWORK: "off"
      GOCACHE: ${{ github.workspace }}/.cache/go-build
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.sum
            script/env.sh
      - name: Check native remote ownership and recovery races
        run: go test -race ./internal/backend/codex ./internal/backend/caelis ./internal/machines ./internal/remotework ./internal/tasks ./internal/taskterminal ./cmd/caelis-remote
      - name: Build Linux amd64 and arm64 helpers
        run: bash script/build-remote-helper.sh "$PWD/.cache/ci-remote-helper"
  # Keep the existing required check name. Failed/cancelled/missing jobs must
  # fail this gate; only content-validated docs/version changes may skip builds.
  product:
    needs: [scope, macos-product, linux-headless]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - name: Require every selected check to pass
        env:
          CI_KIND: ${{ needs.scope.outputs.kind }}
          CI_SCOPE_RESULT: ${{ needs.scope.result }}
          CI_MACOS_RESULT: ${{ needs.macos-product.result }}
          CI_LINUX_RESULT: ${{ needs.linux-headless.result }}
        run: node script/ci-scope.mjs --gate
