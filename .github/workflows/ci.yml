name: Product checks
on:
  pull_request:
  workflow_dispatch:
    inputs:
      preview:
        description: Package and upload a development DMG
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: product-${{ github.ref }}
  cancel-in-progress: true
jobs:
  scope:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      kind: ${{ steps.scope.outputs.kind }}
      preview: ${{ steps.scope.outputs.preview }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The PR merge commit and its parents are enough for the base diff.
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - name: Validate CI routing and release metadata rules
        run: |
          node --test script/ci-scope.test.mjs script/release-version.test.mjs
          node script/check-public-tree.mjs
      - name: Select checks from changed content
        id: scope
        env:
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          node script/ci-scope.mjs
          git diff --check
  macos-product:
    needs: scope
    if: contains(fromJSON('["full","shared","macos"]'), needs.scope.outputs.kind)
    runs-on: macos-15
    timeout-minutes: 30
    env:
      BOT_BUILD_CHANNEL: development
      GOWORK: "off"
      GOCACHE: ${{ github.workspace }}/.cache/go-build
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: package-lock.json
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.sum
            script/env.sh
      - name: Validate workflows
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
      - run: npm ci
      - run: make check
      - run: npm run smoke:assets
  # Full app packaging is valuable when its inputs change, but recompiling the
  # production-tagged app after the full source suite serializes every PR.
  # Release always rebuilds and signs the complete app independently.
  macos-preview:
    needs: scope
    if: needs.scope.outputs.preview == 'true' || inputs.preview == true
    runs-on: macos-15
    timeout-minutes: 30
    env:
      BOT_BUILD_CHANNEL: development
      GOWORK: "off"
      GOCACHE: ${{ github.workspace }}/.cache/go-build
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: package-lock.json
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.sum
            script/env.sh
      - run: npm ci
      - name: Build Dev app with Desktop World
        run: make build
      - name: Verify pinned Desktop World payload without desktop permissions
        run: bash script/verify-desktop-world.sh 'dist/Caelis Bot Dev.app' adhoc
      - name: Package and verify mounted Dev DMG
        run: bash script/package.sh --skip-build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos-arm64-dev-preview
          path: |
            dist/releases/Caelis-Bot-Dev-*.dmg
            dist/releases/Caelis-Bot-Dev-*.dmg.sha256
          if-no-files-found: error
          retention-days: 7
  linux-headless:
    needs: scope
    if: contains(fromJSON('["full","shared"]'), needs.scope.outputs.kind)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GOWORK: "off"
      GOCACHE: ${{ github.workspace }}/.cache/go-build
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.sum
            script/env.sh
      - name: Check native remote ownership and recovery races
        run: go test -race ./internal/backend/codex ./internal/backend/caelis ./internal/machines ./internal/remotework ./internal/tasks ./internal/taskterminal ./internal/weixin ./internal/secretstore ./cmd/caelis-remote
      - name: Build Linux amd64 and arm64 helpers
        run: bash script/build-remote-helper.sh "$PWD/.cache/ci-remote-helper"
  windows-product:
    needs: scope
    if: contains(fromJSON('["full","shared","windows"]'), needs.scope.outputs.kind)
    runs-on: windows-2025
    timeout-minutes: 30
    env:
      GOWORK: "off"
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Run native Windows shared and platform contracts
        shell: pwsh
        run: |
          npm ci
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./script/check-windows.ps1
      - name: Verify pinned Windows Desktop World payload
        shell: pwsh
        run: |
          $plugins = '.cache/ci-desktop-world/Plugins'
          $package = Join-Path $plugins 'desktop-world'
          & ./script/stage-desktop-world-windows.ps1 -Destination $package
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $inventory = Get-Content -Raw -LiteralPath (Join-Path $plugins 'desktop-world-inventory.json') | ConvertFrom-Json
          if ($inventory.ID -ne 'desktop-world' -or $inventory.Title -ne 'Computer Use' -or
              $inventory.titleZh -ne '电脑操控' -or $inventory.Version -ne '0.1.0-rc.9') {
            throw 'Windows Desktop World plugin inventory mismatch'
          }
          $version = & (Join-Path $package 'bin/dtw.exe') version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($version -ne 'dtw 0.1.0-rc.9 (CUA source d74a9cab3fb2)') {
            throw 'Windows Desktop World runtime or VC dependency mismatch'
          }
  # Keep the existing required check name. Failed/cancelled/missing jobs must
  # fail this gate; only content-validated docs/version changes may skip builds.
  product:
    needs: [scope, macos-product, macos-preview, windows-product, linux-headless]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            script/ci-scope.mjs
            script/release-version.mjs
            .node-version
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - name: Require every selected check to pass
        env:
          CI_KIND: ${{ needs.scope.outputs.kind }}
          CI_SCOPE_RESULT: ${{ needs.scope.result }}
          CI_MACOS_RESULT: ${{ needs.macos-product.result }}
          CI_PREVIEW_RESULT: ${{ needs.macos-preview.result }}
          CI_PREVIEW_REQUIRED: ${{ needs.scope.outputs.preview == 'true' || inputs.preview == true }}
          CI_WINDOWS_RESULT: ${{ needs.windows-product.result }}
          CI_LINUX_RESULT: ${{ needs.linux-headless.result }}
        run: node script/ci-scope.mjs --gate
