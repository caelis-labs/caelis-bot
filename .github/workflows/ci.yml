name: Product checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: product-${{ github.ref }}
  cancel-in-progress: true
jobs:
  linux-headless:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GOWORK: "off"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Build headless Go commands
        run: go build ./cmd/...
      - name: Check Linux process ownership and private IPC
        run: |
          go test -race -count=1 -run '^(TestLinux|TestOwnedProcess|TestCompatibleProtocol|TestFailedProtocolHandshake|TestStalledHandshakeCancellation|TestPrivateEndpoint)' ./internal/backend/codex ./internal/localipc
      - name: Check headless product receipts and runtime management
        run: |
          go test -race -count=1 ./internal/productrpc ./internal/productmanagement ./internal/runtimemanagement ./cmd/caelis-node
      - name: Check paired Worker source receipts and observer lifecycle
        run: |
          go test -race -count=1 ./internal/nodeworker ./internal/workerwire ./internal/nodes
      - name: Check node roaming authority and complete Notebook snapshots
        run: |
          go test -race -count=1 ./internal/nodeplane ./internal/nodeagent ./internal/nodecoord ./internal/nodebroker ./internal/roaming ./internal/leasepower ./internal/memorytransfer
  product:
    runs-on: macos-14
    timeout-minutes: 30
    env:
      BOT_BUILD_CHANNEL: development
      GOWORK: "off"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: package-lock.json
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Validate workflows
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
      - run: npm ci
      - run: make check
      - name: Check desktop authority, receipts and projection races
        run: |
          source script/env.sh
          go test -race ./internal/desktopcontrol ./internal/bot ./internal/backend/caelis ./internal/backend/codex
      - run: npm run smoke:assets
      - name: Build independent Dev app with Desktop World
        run: make build
      - name: Verify pinned Desktop World payload without desktop permissions
        run: bash script/verify-desktop-world.sh 'dist/Caelis Bot Dev.app' adhoc
      - name: Exercise the packaged Go host and independent helper
        run: |
          source script/env.sh
          export CAELIS_BOT_TEST_DESKTOP_WORLD="$PWD/dist/Caelis Bot Dev.app/Contents/Resources/DesktopWorld/bin/desktop-world"
          go test -count=1 -run '^TestPackagedHelperReadAndDeniedInput$' -v ./internal/desktopcontrol
      - name: Package and verify mounted Dev DMG
        run: bash script/package.sh --skip-build
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: macos-arm64-dev-preview
          path: |
            dist/releases/Caelis-Bot-Dev-*.dmg
            dist/releases/Caelis-Bot-Dev-*.dmg.sha256
          if-no-files-found: error
          retention-days: 7
