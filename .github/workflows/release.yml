name: Release DMG
on:
  workflow_call:
    secrets:
      APPLE_DEVELOPER_ID_P12_BASE64:
        required: false
      APPLE_DEVELOPER_ID_P12_PASSWORD:
        required: false
      APPLE_NOTARY_APPLE_ID:
        required: false
      APPLE_NOTARY_PASSWORD:
        required: false
      SPARKLE_PRIVATE_KEY:
        required: false
      R2_ACCESS_KEY_ID:
        required: false
      R2_SECRET_ACCESS_KEY:
        required: false
      R2_ENDPOINT:
        required: false
    inputs:
      tag:
        required: true
        type: string
      resume_run_id:
        description: Completed main release run with a notarization checkpoint
        required: false
        default: ''
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release-please draft tag to build or recover
        required: true
        type: string
      resume_run_id:
        description: Resume signed artifacts and Apple IDs from this release run (optional)
        required: false
        default: ''
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: release-dmg-${{ inputs.tag }}
  cancel-in-progress: false
jobs:
  build:
    if: github.repository == 'caelis-labs/caelis-bot' && github.ref == 'refs/heads/main'
    runs-on: macos-14
    timeout-minutes: 30
    outputs:
      sha: ${{ steps.source.outputs.sha }}
      name: ${{ steps.source.outputs.name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve immutable release source
        id: source
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]
          sha=$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")
          git merge-base --is-ancestor "$sha" origin/main
          git checkout --detach "$sha"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "name=Caelis-Bot-${RELEASE_TAG#v}-macos-arm64" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
      - name: Match package version to release tag
        env:
          BOT_RELEASE_TAG: ${{ inputs.tag }}
        run: node script/release-version.mjs
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - run: npm ci
      - run: make check
      - run: make check-updater
      - run: npm run smoke:assets
      - name: Build without release credentials
        env:
          BOT_RELEASE_TAG: ${{ inputs.tag }}
          BOT_SPARKLE_PUBLIC_KEY: ${{ vars.SPARKLE_PUBLIC_KEY }}
        run: |
          make build
          ditto -c -k --keepParent 'dist/Caelis Bot.app' dist/unsigned-app.zip
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: unsigned-app
          path: dist/unsigned-app.zip
          if-no-files-found: error
          retention-days: 1
  package:
    needs: build
    runs-on: macos-14
    environment: macos-release
    timeout-minutes: 150
    outputs:
      verified: ${{ steps.verify.outputs.verified }}
    env:
      BOT_RELEASE_TAG: ${{ inputs.tag }}
      BOT_SIGNING_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
      BOT_RELEASE_SOURCE_SHA: ${{ needs.build.outputs.sha }}
      BOT_NOTARY_WAIT_TIMEOUT: 60m
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Operational signing fixes must not require moving an immutable app tag.
          # The downloaded app is still built and verified against the tag's SHA.
          ref: ${{ github.workflow_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: unsigned-app
          path: dist
      - name: Verify build provenance before signing
        env:
          RELEASE_SHA: ${{ needs.build.outputs.sha }}
        run: |
          ditto -x -k dist/unsigned-app.zip dist
          test "$(/usr/libexec/PlistBuddy -c 'Print CaelisSourceCommit' 'dist/Caelis Bot.app/Contents/Info.plist')" = "$RELEASE_SHA"
          bash script/verify-signature.sh 'dist/Caelis Bot.app' adhoc
      - name: Restore a trusted notarization checkpoint
        if: inputs.resume_run_id != ''
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RESUME_RUN_ID: ${{ inputs.resume_run_id }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RESUME_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          gh api "repos/$GH_REPO/actions/runs/$RESUME_RUN_ID" > "$RUNNER_TEMP/resume-run.json"
          source_sha=$(node script/verify-notarization-run.mjs "$RUNNER_TEMP/resume-run.json" "$GH_REPO" "$RESUME_RUN_ID")
          git merge-base --is-ancestor "$source_sha" origin/main
          gh run download "$RESUME_RUN_ID" --repo "$GH_REPO" --name notarization-checkpoint --dir dist/notarization
      - name: Sign, notarize and verify app and DMG
        id: verify
        env:
          BOT_SIGNING_CERTIFICATE_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_P12_BASE64 }}
          BOT_SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_P12_PASSWORD }}
          BOT_NOTARY_APPLE_ID: ${{ secrets.APPLE_NOTARY_APPLE_ID }}
          BOT_NOTARY_PASSWORD: ${{ secrets.APPLE_NOTARY_PASSWORD }}
          BOT_NOTARY_RESUME: ${{ inputs.resume_run_id != '' && '1' || '0' }}
        run: |
          bash script/sign-release.sh
      - name: Remove any signing material after cancellation or failure
        if: always()
        shell: bash
        run: |
          shopt -s nullglob
          for directory in "$RUNNER_TEMP"/caelis-signing.*; do
            security delete-keychain "$directory/release.keychain-db" >/dev/null 2>&1 || true
            rm -rf "$directory"
          done
      - name: Sign the stable update feed after notarization
        if: steps.verify.outputs.verified == 'true' && !contains(inputs.tag, '-')
        env:
          BOT_SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          BOT_SPARKLE_PUBLIC_KEY: ${{ vars.SPARKLE_PUBLIC_KEY }}
        run: bash script/prepare-appcast.sh
      - name: Preserve signed artifacts and notarization receipts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: notarization-checkpoint
          path: dist/notarization/
          if-no-files-found: ignore
          retention-days: 14
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: steps.verify.outputs.verified == 'true'
        with:
          name: release-dmg
          path: |
            dist/releases/*.dmg
            dist/releases/*.dmg.sha256
            dist/releases/appcast.xml
            dist/releases/latest.json
            dist/releases/latest.json.sig
          if-no-files-found: error
          retention-days: 14
  publish:
    needs: [build, package]
    if: needs.package.outputs.verified == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-dmg
          path: release
      - name: Publish only the verified draft
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_SHA: ${{ needs.build.outputs.sha }}
          RELEASE_NAME: ${{ needs.build.outputs.name }}
          RELEASE_VERIFIED: ${{ needs.package.outputs.verified }}
        shell: bash
        run: |
          set -euo pipefail
          test "$RELEASE_VERIFIED" = true
          cd release
          test -f "$RELEASE_NAME.dmg"
          test -f "$RELEASE_NAME.dmg.sha256"
          sha256sum --check "$RELEASE_NAME.dmg.sha256"
          actual_sha=$(gh api "repos/$GH_REPO/commits/$RELEASE_TAG" --jq .sha)
          test "$actual_sha" = "$RELEASE_SHA"
          test "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" = true
          # Recovery may replace draft assets; published assets are never overwritten here.
          gh release upload "$RELEASE_TAG" "$RELEASE_NAME.dmg" "$RELEASE_NAME.dmg.sha256" --clobber
          if [[ "$RELEASE_TAG" != *-* ]]; then
            test -s appcast.xml && test -s latest.json && test -s latest.json.sig
            gh release upload "$RELEASE_TAG" appcast.xml latest.json latest.json.sig --clobber
          fi
          prerelease=false
          latest=true
          if [[ "$RELEASE_TAG" == *-* ]]; then prerelease=true; latest=false; fi
          gh release view "$RELEASE_TAG" --json body --jq .body > /tmp/caelis-release-notes.md
          cat >> /tmp/caelis-release-notes.md <<'NOTES'

          ### Install / 安装

          For Apple Silicon Macs. Download the DMG and its SHA-256 file.
          Select Caelis or Codex during setup; runtimes are installed separately.

          适用于 Apple Silicon Mac；下载 DMG 和 SHA-256 文件。
          首次启动可选择 Caelis 或 Codex，运行时独立安装。
          [Installation & first launch](https://github.com/caelis-labs/caelis-bot/blob/main/docs/install.md) · [安装与首次启动](https://github.com/caelis-labs/caelis-bot/blob/main/docs/install.zh-CN.md)
          [Caelis runtime compatibility / Caelis 接入](https://github.com/caelis-labs/caelis-bot/blob/main/docs/caelis-integration.md)
          NOTES
          gh release edit "$RELEASE_TAG" --draft=false --prerelease="$prerelease" --latest="$latest" --notes-file /tmp/caelis-release-notes.md
  r2:
    needs: [build, package, publish]
    if: needs.package.outputs.verified == 'true' && !contains(inputs.tag, '-')
    runs-on: ubuntu-latest
    environment: macos-release
    timeout-minutes: 20
    concurrency:
      group: caelis-bot-r2-latest
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-dmg
          path: release
      - name: Publish verified update and retain only latest Bot release
        env:
          GH_TOKEN: ${{ github.token }}
          BOT_RELEASE_TAG: ${{ inputs.tag }}
          BOT_SPARKLE_PUBLIC_KEY: ${{ vars.SPARKLE_PUBLIC_KEY }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET: caelis-releases
        run: node script/publish-r2.mjs release
