name: Release DMG
on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release-please draft tag to build or recover
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: release-dmg-${{ inputs.tag }}
  cancel-in-progress: false
jobs:
  build:
    if: github.repository == 'caelis-labs/caelis-bot' && github.ref == 'refs/heads/main'
    runs-on: macos-14
    timeout-minutes: 30
    outputs:
      sha: ${{ steps.source.outputs.sha }}
      name: ${{ steps.source.outputs.name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve immutable release source
        id: source
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]
          sha=$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")
          git merge-base --is-ancestor "$sha" origin/main
          git checkout --detach "$sha"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "name=Caelis-Bot-${RELEASE_TAG#v}-macos-arm64" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
      - name: Match package version to release tag
        env:
          BOT_RELEASE_TAG: ${{ inputs.tag }}
        run: node script/release-version.mjs
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - run: npm ci
      - run: make check
      - run: npm run smoke:assets
      - name: Build and verify signed app inside DMG
        env:
          BOT_RELEASE_TAG: ${{ inputs.tag }}
        run: make package
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-dmg
          path: |
            dist/releases/*.dmg
            dist/releases/*.dmg.sha256
          if-no-files-found: error
          retention-days: 14
  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-dmg
          path: release
      - name: Publish only the verified draft
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_SHA: ${{ needs.build.outputs.sha }}
          RELEASE_NAME: ${{ needs.build.outputs.name }}
        shell: bash
        run: |
          set -euo pipefail
          cd release
          test "$(find . -type f | wc -l)" -eq 2
          test -f "$RELEASE_NAME.dmg"
          test -f "$RELEASE_NAME.dmg.sha256"
          sha256sum --check "$RELEASE_NAME.dmg.sha256"
          actual_sha=$(gh api "repos/$GH_REPO/commits/$RELEASE_TAG" --jq .sha)
          test "$actual_sha" = "$RELEASE_SHA"
          test "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" = true
          # Recovery may replace draft assets; published assets are never overwritten here.
          gh release upload "$RELEASE_TAG" "$RELEASE_NAME.dmg" "$RELEASE_NAME.dmg.sha256" --clobber
          prerelease=false
          latest=true
          if [[ "$RELEASE_TAG" == *-* ]]; then prerelease=true; latest=false; fi
          gh release view "$RELEASE_TAG" --json body --jq .body > /tmp/caelis-release-notes.md
          cat >> /tmp/caelis-release-notes.md <<'NOTES'

          ### Install / 安装

          Apple Silicon macOS preview. Download the DMG and its SHA-256 file.
          This app is ad-hoc signed, without Developer ID or Apple notarization.
          A locally available Codex runtime is required for conversations.

          当前为 Apple Silicon 预览版：本地签名，尚未经过 Apple 公证；对话需本机 Codex。
          [Installation & first launch](https://github.com/caelis-labs/caelis-bot/blob/main/docs/install.md) · [安装与首次启动](https://github.com/caelis-labs/caelis-bot/blob/main/docs/install.zh-CN.md)
          NOTES
          gh release edit "$RELEASE_TAG" --draft=false --prerelease="$prerelease" --latest="$latest" --notes-file /tmp/caelis-release-notes.md
