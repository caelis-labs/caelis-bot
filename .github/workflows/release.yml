name: Release macOS arm64
on:
  workflow_call:
    secrets:
      APPLE_DEVELOPER_ID_P12_BASE64:
        required: false
      APPLE_DEVELOPER_ID_P12_PASSWORD:
        required: false
      APPLE_NOTARY_APPLE_ID:
        required: false
      APPLE_NOTARY_PASSWORD:
        required: false
      SPARKLE_PRIVATE_KEY:
        required: false
      R2_ACCESS_KEY_ID:
        required: false
      R2_SECRET_ACCESS_KEY:
        required: false
      R2_ENDPOINT:
        required: false
    inputs:
      tag:
        required: true
        type: string
      resume_run_id:
        description: Completed main release run with a notarization checkpoint
        required: false
        default: ''
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release-please draft tag to build or recover
        required: true
        type: string
      resume_run_id:
        description: Resume signed artifacts and Apple IDs from this release run (optional)
        required: false
        default: ''
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: release-dmg-${{ inputs.tag }}
  cancel-in-progress: false
jobs:
  build:
    if: github.repository == 'caelis-labs/caelis-bot' && github.ref == 'refs/heads/main'
    runs-on: macos-15
    timeout-minutes: 30
    env:
      GOWORK: "off"
      GOCACHE: ${{ github.workspace }}/.cache/go-build
    outputs:
      sha: ${{ steps.source.outputs.sha }}
      name: ${{ steps.source.outputs.name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve immutable release source
        id: source
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          sha=$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")
          git merge-base --is-ancestor "$sha" origin/main
          git checkout --detach "$sha"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "name=Caelis-Bot-${RELEASE_TAG#v}-macos-arm64" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Match package version to release tag
        env:
          BOT_RELEASE_TAG: ${{ inputs.tag }}
        run: node script/release-version.mjs
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.sum
            script/env.sh
      - run: npm ci
      # Source checks run at the strict, up-to-date PR merge gate. This job
      # qualifies the release-mode artifact built from the immutable main tag.
      - run: make check-updater
      - run: npm run smoke:assets
      - name: Build without release credentials
        env:
          BOT_BUILD_CHANNEL: release
          BOT_RELEASE_TAG: ${{ inputs.tag }}
          BOT_SPARKLE_PUBLIC_KEY: ${{ vars.SPARKLE_PUBLIC_KEY }}
        run: |
          make build
          ditto -c -k --keepParent 'dist/Caelis Bot.app' dist/unsigned-app.zip
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: unsigned-app
          path: dist/unsigned-app.zip
          if-no-files-found: error
          retention-days: 1
  package:
    needs: build
    runs-on: macos-15
    environment: macos-release
    timeout-minutes: 150
    outputs:
      verified: ${{ steps.verify.outputs.verified }}
    env:
      BOT_RELEASE_TAG: ${{ inputs.tag }}
      BOT_SIGNING_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
      BOT_RELEASE_SOURCE_SHA: ${{ needs.build.outputs.sha }}
      BOT_NOTARY_WAIT_TIMEOUT: 60m
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Operational signing fixes must not require moving an immutable app tag.
          # The downloaded app is still built and verified against the tag's SHA.
          ref: ${{ github.workflow_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: unsigned-app
          path: dist
      - name: Verify provenance and bundled native dependencies before signing
        env:
          RELEASE_SHA: ${{ needs.build.outputs.sha }}
        run: |
          ditto -x -k dist/unsigned-app.zip dist
          test "$(/usr/libexec/PlistBuddy -c 'Print CaelisSourceCommit' 'dist/Caelis Bot.app/Contents/Info.plist')" = "$RELEASE_SHA"
          bash script/verify-signature.sh 'dist/Caelis Bot.app' adhoc
      - name: Restore a trusted notarization checkpoint
        if: inputs.resume_run_id != ''
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RESUME_RUN_ID: ${{ inputs.resume_run_id }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RESUME_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          gh api "repos/$GH_REPO/actions/runs/$RESUME_RUN_ID" > "$RUNNER_TEMP/resume-run.json"
          source_sha=$(node script/verify-notarization-run.mjs "$RUNNER_TEMP/resume-run.json" "$GH_REPO" "$RESUME_RUN_ID")
          git merge-base --is-ancestor "$source_sha" origin/main
          gh run download "$RESUME_RUN_ID" --repo "$GH_REPO" --name notarization-checkpoint --dir dist/notarization
      - name: Sign, notarize and verify app and DMG
        id: verify
        env:
          BOT_SIGNING_CERTIFICATE_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_P12_BASE64 }}
          BOT_SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_P12_PASSWORD }}
          BOT_NOTARY_APPLE_ID: ${{ secrets.APPLE_NOTARY_APPLE_ID }}
          BOT_NOTARY_PASSWORD: ${{ secrets.APPLE_NOTARY_PASSWORD }}
          BOT_NOTARY_RESUME: ${{ inputs.resume_run_id != '' && '1' || '0' }}
        run: |
          bash script/sign-release.sh
      - name: Remove any signing material after cancellation or failure
        if: always()
        shell: bash
        run: |
          shopt -s nullglob
          for directory in "$RUNNER_TEMP"/caelis-signing.*; do
            security delete-keychain "$directory/release.keychain-db" >/dev/null 2>&1 || true
            rm -rf "$directory"
          done
      - name: Sign this platform's update metadata after notarization
        if: steps.verify.outputs.verified == 'true'
        env:
          BOT_SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          BOT_SPARKLE_PUBLIC_KEY: ${{ vars.SPARKLE_PUBLIC_KEY }}
        run: bash script/prepare-appcast.sh
      - name: Preserve signed artifacts and notarization receipts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: notarization-checkpoint
          path: dist/notarization/
          if-no-files-found: ignore
          retention-days: 14
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: steps.verify.outputs.verified == 'true'
        with:
          name: release-dmg
          path: |
            dist/releases/*.dmg
            dist/releases/*.dmg.sha256
            dist/releases/appcast.xml
            dist/releases/latest.json
            dist/releases/latest.json.sig
          if-no-files-found: error
          retention-days: 14
  publish:
    needs: [build, package]
    if: needs.package.outputs.verified == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-dmg
          path: release
      - name: Reconcile immutable macOS publication
        env:
          GH_TOKEN: ${{ github.token }}
          BOT_RELEASE_TAG: ${{ inputs.tag }}
          BOT_RELEASE_SOURCE_SHA: ${{ needs.build.outputs.sha }}
          BOT_RELEASE_VALIDATION: developer-id-notarized-stapled-gatekeeper
        run: node script/publication.mjs release macos arm64 stable
  r2:
    needs: [build, package, publish]
    if: needs.package.outputs.verified == 'true'
    runs-on: ubuntu-24.04
    environment: macos-release
    timeout-minutes: 20
    concurrency:
      group: caelis-bot-r2-macos-arm64-stable
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-dmg
          path: release
      - name: Publish verified macOS update feed
        env:
          GH_TOKEN: ${{ github.token }}
          BOT_RELEASE_TAG: ${{ inputs.tag }}
          BOT_SPARKLE_PUBLIC_KEY: ${{ vars.SPARKLE_PUBLIC_KEY }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET: caelis-releases
        run: node script/publish-r2.mjs release
  latest:
    needs: [build, package, publish, r2]
    if: needs.package.outputs.verified == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - name: Reconcile GitHub Latest after R2 is current
        env:
          GH_TOKEN: ${{ github.token }}
          BOT_RELEASE_TAG: ${{ inputs.tag }}
        run: node script/sync-github-latest.mjs
